openapi: 3.0.3
info:
  title: Employee Management API
  description: A sample API for managing employees, demonstrating various data types for PageGen.
  version: 1.0.0
servers:
  - url: /
    description: Relative path to the API server
tags:
  - name: Employees
    description: Core CRUD operations for the Employee resource
  - name: CSV
    description: CSV import/export operations for Employees
  - name: Reference Data
    description: Operations for fetching reference data like departments

paths:
  /employees:
    get:
      tags:
        - Employees
      summary: Search employees
      description: Retrieves a paginated list of employees based on filter criteria.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Filter by employee name (allows partial match).
        - name: department_id
          in: query
          schema:
            type: string
          description: Filter by department ID.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: A list of employees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSearchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Employees
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: Employee created successfully.
          headers:
            Location:
              description: The path to the newly created employee.
              schema:
                type: string
                example: /employees?employee_id=EMP001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/detail:
    get:
      tags:
        - Employees
      summary: Get employee details
      description: Retrieves a single employee's details by their primary key.
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: string
          description: The primary key of the employee.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/update:
    put:
      tags:
        - Employees
      summary: Update an existing employee
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: string
          description: The primary key of the employee to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Employee updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/delete:
    delete:
      tags:
        - Employees
      summary: Delete an employee
      description: Deletes an employee identified by their primary key.
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: string
          description: The primary key of the employee to delete.
      responses:
        '200':
          description: Employee deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/download:
    post:
      tags:
        - CSV
      summary: Download employee data as a CSV file
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvDownloadRequest'
      responses:
        '200':
          description: A CSV file stream of employees.
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="employees_20250925.csv"'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/upload:
    post:
      tags:
        - CSV
      summary: Upload a CSV file to bulk-create or update employees
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The result of the bulk upload process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvUploadResponse'
        '400':
          description: Bad Request or schema mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /departments:
    get:
      tags:
        - Reference Data
      summary: Get a list of departments
      description: Retrieves a list of all departments for use in dropdowns.
      responses:
        '200':
          description: A list of departments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'

components:
  schemas:
    Employee:
      type: object
      description: Represents a single employee.
      properties:
        employee_id:
          type: string
          description: "Unique identifier for the employee (e.g., 'EMP001'). Primary Key."
          example: "EMP102"
        name:
          type: string
          description: "Employee's full name."
          example: "山田 太郎"
        department_id:
          type: string
          description: "ID of the department the employee belongs to. Foreign key to Departments."
          example: "D02"
        employment_type:
          type: string
          description: "Employment status."
          enum: [full-time, part-time, contract]
          example: "full-time"
        hire_date:
          type: string
          format: date
          description: "The date the employee was hired."
          example: "2023-04-01"
        salary:
          type: integer
          format: int64
          description: "Employee's monthly salary in JPY."
          example: 350000
        is_active:
          type: boolean
          description: "Logical delete flag. false means deleted."
          example: true
        created_at:
          type: string
          format: date-time
          description: "Timestamp of creation."
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: "Timestamp of last update."
          readOnly: true
      required:
        - employee_id
        - name
        - department_id
        - hire_date

    Department:
      type: object
      properties:
        id:
          type: string
          description: "Unique identifier for the department."
          example: "D01"
        name:
          type: string
          description: "Name of the department."
          example: "営業部"

    EmployeeResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Employee'

    EmployeeSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          example: true
        affected:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    CsvDownloadRequest:
      type: object
      properties:
        filters:
          type: object
          additionalProperties: true
        columns:
          type: array
          items:
            type: string
        orderBy:
          type: string
        order:
          type: string
          enum: [asc, desc]

    CsvUploadResponse:
      type: object
      properties:
        total:
          type: integer
        processed:
          type: integer
        inserted:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              field:
                type: string
              code:
                type: string
              message:
                type: string