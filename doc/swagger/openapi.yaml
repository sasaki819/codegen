openapi: 3.0.3
info:
  title: PageGen Sample API
  description: A sample API for managing Employees, Departments, and Products.
  version: 1.1.0
servers:
  - url: /
    description: Relative path to the API server
tags:
  - name: Employees
    description: Core CRUD operations for the Employee resource
  - name: Departments
    description: Core CRUD operations for the Department resource
  - name: Products
    description: Core CRUD operations for the Product resource
  - name: Reference Data
    description: Operations for fetching reference data
  - name: CSV
    description: CSV import/export operations

paths:
  # --- Employees ---
  /employees:
    get:
      tags: [Employees]
      summary: Search employees
      description: Retrieves a paginated list of employees based on filter criteria.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Filter by employee name (allows partial match).
        - name: department_id
          in: query
          schema:
            type: string
          description: Filter by department ID.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: A list of employees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSearchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: Employee created successfully.
          headers:
            Location:
              description: The path to the newly created employee.
              schema:
                type: string
                example: /employees?employee_id=EMP001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/detail:
    get:
      tags: [Employees]
      summary: Get employee details
      description: Retrieves a single employee's details by their primary key.
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: string
          description: The primary key of the employee.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/update:
    put:
      tags: [Employees]
      summary: Update an existing employee
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: string
          description: The primary key of the employee to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Employee updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/delete:
    delete:
      tags: [Employees]
      summary: Delete an employee
      description: Deletes an employee identified by their primary key.
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: string
          description: The primary key of the employee to delete.
      responses:
        '200':
          description: Employee deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/download:
    post:
      tags: [Employees, CSV]
      summary: Download employee data as a CSV file
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvDownloadRequest'
      responses:
        '200':
          description: A CSV file stream of employees.
          content:
            text/csv:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="employees_20250925.csv"'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/upload:
    post:
      tags: [Employees, CSV]
      summary: Upload a CSV file for employees
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The result of the bulk upload process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvUploadResponse'
        '400':
          description: Bad Request or schema mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- Departments ---
  /departments:
    get:
      tags: [Departments]
      summary: Search departments
      description: Retrieves a paginated list of departments.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Filter by department name.
      responses:
        '200':
          description: A list of departments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
    post:
      tags: [Departments]
      summary: Create a new department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        '201':
          description: Department created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'

  /departments/update:
    put:
      tags: [Departments]
      summary: Update a department
      parameters:
        - name: department_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        '200':
          description: Department updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'

  /departments/delete:
    delete:
      tags: [Departments]
      summary: Delete a department
      parameters:
        - name: department_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  # --- Products ---
  /products:
    get:
      tags: [Products]
      summary: Search products
      description: Retrieves a list of products based on filter criteria.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Filter by product name.
        - name: category_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/update:
    put:
      tags: [Products]
      summary: Update a product
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/delete:
    delete:
      tags: [Products]
      summary: Delete a product
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  # --- Reference Data ---
  /product-categories:
    get:
      tags: [Reference Data]
      summary: Get a list of product categories
      responses:
        '200':
          description: A list of product categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'

components:
  schemas:
    # --- Employee Schemas ---
    Employee:
      type: object
      description: Represents a single employee.
      properties:
        employee_id:
          type: string
          description: "Unique identifier for the employee (e.g., 'EMP001'). Primary Key."
          example: "EMP102"
        name:
          type: string
          description: "Employee's full name."
          example: "山田 太郎"
        department_id:
          type: string
          description: "ID of the department the employee belongs to. Foreign key to Departments."
          example: "D02"
        employment_type:
          type: string
          description: "Employment status."
          enum: [full-time, part-time, contract]
          example: "full-time"
        hire_date:
          type: string
          format: date
          description: "The date the employee was hired."
          example: "2023-04-01"
        salary:
          type: integer
          format: int64
          description: "Employee's monthly salary in JPY."
          example: 350000
        is_active:
          type: boolean
          description: "Logical delete flag. false means deleted."
          example: true
        created_at:
          type: string
          format: date-time
          description: "Timestamp of creation."
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: "Timestamp of last update."
          readOnly: true
      required:
        - employee_id
        - name
        - department_id
        - hire_date
    EmployeeResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/Employee'
    EmployeeSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # --- Department Schemas ---
    Department:
      type: object
      properties:
        department_id:
          type: string
          description: "Unique identifier for the department."
          example: "D01"
        name:
          type: string
          description: "Name of the department."
          example: "営業部"
        manager_id:
          type: string
          description: "Employee ID of the department manager."
          example: "EMP001"
        budget:
          type: integer
          format: int64
          description: "Annual budget in JPY."
          example: 50000000
        establishment_date:
          type: string
          format: date
          description: "The date the department was established."
          example: "2010-04-01"

    # --- Product Schemas ---
    Product:
      type: object
      properties:
        product_id:
          type: string
          description: "Unique identifier for the product."
          example: "PROD-00123"
        name:
          type: string
          description: "Name of the product."
          example: "高性能ノートPC 14インチ"
        description:
          type: string
          description: "Detailed description of the product."
          example: "最新CPU搭載の軽量・薄型モデル。バッテリー駆動時間15時間。"
        price:
          type: integer
          format: int32
          description: "Retail price in JPY."
          example: 230000
        stock_quantity:
          type: integer
          format: int32
          description: "Current quantity in stock."
          example: 150
        category_id:
          type: string
          description: "Category ID for the product."
          example: "CAT-PC"
        is_available:
          type: boolean
          description: "True if the product is available for sale."
          example: true
    ProductCategory:
      type: object
      properties:
        category_id:
          type: string
          description: "Unique ID for the product category."
          example: "CAT-PC"
        name:
          type: string
          description: "Name of the product category."
          example: "PC・周辺機器"

    # --- Common Schemas ---
    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          example: true
        affected:
          type: integer
          example: 1
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    CsvDownloadRequest:
      type: object
      properties:
        filters:
          type: object
          additionalProperties: true
        columns:
          type: array
          items:
            type: string
        orderBy:
          type: string
        order:
          type: string
          enum: [asc, desc]
    CsvUploadResponse:
      type: object
      properties:
        total:
          type: integer
        processed:
          type: integer
        inserted:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              field:
                type: string
              code:
                type: string
              message:
                type: string